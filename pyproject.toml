[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-lab"
version = "0.1.0"
description = "Local image library and editor with optional AI-assisted analysis"
authors = [{name = "OldJobobo"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["imagescope==0.1.0rc2", "Pillow>=10"]

[project.urls]
Repository = "https://github.com/commonfire-foundation/image-lab"
Issues = "https://github.com/commonfire-foundation/image-lab/issues"

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]

[project.scripts]
image-lab = "image_lab:main"
image-lab-ui = "image_lab_ui.app:main"

[tool.setuptools]
py-modules = ["image_lab"]
packages = ["image_lab_ui"]

[tool.setuptools.package-data]
image_lab_ui = ["*.qml", "assets/*.svg"]
